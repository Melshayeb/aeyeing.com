<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OzMoEg Bubble View Prototype</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<style>
:root {
  --bg: #0b0f17;
  --panel: #111827;
  --panel-2: #1f2937;
  --text: #f8fafc;
  --text-2: #94a3b8;
  --accent: #2dd4bf;
  --danger: #f87171;
  --penny: #f59e0b;
  --glow: #22d3ee;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  height: 100vh; display: flex; flex-direction: column;
}
#header {
  background: var(--panel); border-bottom: 1px solid var(--panel-2);
  padding: 0.7rem 1.2rem; display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
#header h1 { margin: 0; font-size: 1.15rem; color: var(--accent); }
#controls { display: flex; align-items: center; gap: 0.8rem; }
#last-updated { color: var(--text-2); font-size: 0.8rem; }
button {
  background: var(--panel-2); color: var(--text); border: 1px solid #374151;
  border-radius: 999px; padding: 0.4rem 1rem; font-size: 0.82rem; cursor: pointer;
}
button.primary { background: var(--accent); color: #000; border: none; font-weight: 700; }
button:hover { filter: brightness(1.15); }
#chart-wrap {
  position: relative; flex: 1; min-height: 0; padding: 1rem;
}
#bubbleCanvas { width: 100% !important; height: 100% !important; }
.legend {
  position: absolute; bottom: 18px; left: 18px;
  background: rgba(17,24,39,0.9); border: 1px solid var(--panel-2);
  border-radius: 10px; padding: 0.7rem 1rem; font-size: 0.78rem;
  color: var(--text-2); pointer-events: none; max-width: 280px;
}
.legend .dot {
  display: inline-block; width: 11px; height: 11px; border-radius: 50%;
  margin-right: 6px; vertical-align: middle;
}
.legend .dot.penny { background: rgba(245,158,11,0.55); border: 1px solid var(--penny); }
.legend .dot.glow { background: rgba(34,211,238,0.55); box-shadow: 0 0 8px var(--glow); border: 1px solid var(--glow); }
.legend .dot.alert { background: rgba(248,113,113,0.55); border: 1px solid var(--danger); }
#toast {
  position: absolute; top: 18px; right: 18px;
  background: var(--accent); color: #000; padding: 0.55rem 1rem;
  border-radius: 999px; font-weight: 700; font-size: 0.85rem;
  opacity: 0; transform: translateY(-10px); transition: all 0.3s ease;
  pointer-events: none; z-index: 20;
}
#toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<div id="header">
  <h1>🫧 OzMoEg Bubble View — Prototype</h1>
  <div id="controls">
    <span id="last-updated">—</span>
    <button class="primary" onclick="nextRefresh()">Simulate 1-min refresh</button>
    <button onclick="resetView()">Reset</button>
  </div>
</div>
<div id="chart-wrap">
  <canvas id="bubbleCanvas"></canvas>
  <div class="legend">
    <div><span class="dot penny"></span>Penny stock (&lt; $1)</div>
    <div><span class="dot glow"></span>Price change &gt; 80% (glowing)</div>
    <div><span class="dot alert"></span>ALERT status</div>
    <div style="margin-top:0.3rem;">X = Float (log) &nbsp;|&nbsp; Y = Price &nbsp;|&nbsp; Size = change %</div>
  </div>
  <div id="toast">New ticker: —</div>
</div>

<script>
// Embedded real scanner snapshots (latest 3). Times are UTC.
const snapshots = [
  {"time": "2026-07-30T12:12:57.523075Z", "tickers": [{"ticker": "GCTK", "name": "Glucotrack", "status": "ALERT", "price": 0.285, "float": 7713220.0, "change_pct": -5.0, "volume": 16918520, "market_cap": 2199949.49, "country": "US", "cap_size": "nano-cap", "is_penny": true, "news_status": "—", "news_age": "—", "top_headline": "", "sec_filings": "—", "entry_price": 0.285}, {"ticker": "NUWE", "name": "Nuwellis", "status": "ALERT", "price": 0.1674, "float": 1292730.0, "change_pct": -1.5, "volume": 1172208, "market_cap": 1000000.0, "country": "US", "cap_size": "nano-cap", "is_penny": true, "news_status": "—", "news_age": "—", "top_headline": "", "sec_filings": "—", "entry_price": 0.1674}, {"ticker": "STKH", "name": "Steakholder Foods", "status": "ALERT", "price": 0.3, "float": 3000000.0, "change_pct": 0.0, "volume": 13250614, "market_cap": 3000000.0, "country": "US", "cap_size": "nano-cap", "is_penny": true, "news_status": "—", "news_age": "—", "top_headline": "", "sec_filings": "—", "entry_price": 0.3}]},
  {"time": "2026-07-30T12:10:57.881097Z", "tickers": [{"ticker": "STKH", "name": "Steakholder Foods", "status": "ALERT", "price": 0.3, "float": 3000000.0, "change_pct": 0.0, "volume": 13250614, "market_cap": 3000000.0, "country": "US", "cap_size": "nano-cap", "is_penny": true, "news_status": "—", "news_age": "—", "top_headline": "", "sec_filings": "—", "entry_price": 0.3}, {"ticker": "NUWE", "name": "Nuwellis", "status": "ALERT", "price": 0.1674, "float": 1292730.0, "change_pct": -1.5, "volume": 1172208, "market_cap": 1000000.0, "country": "US", "cap_size": "nano-cap", "is_penny": true, "news_status": "—", "news_age": "—", "top_headline": "", "sec_filings": "—", "entry_price": 0.1674}, {"ticker": "GCTK", "name": "Glucotrack", "status": "ALERT", "price": 0.285, "float": 7713220.0, "change_pct": -5.0, "volume": 16918520, "market_cap": 2199949.49, "country": "US", "cap_size": "nano-cap", "is_penny": true, "news_status": "—", "news_age": "—", "top_headline": "", "sec_filings": "—", "entry_price": 0.285}]},
  {"time": "2026-07-30T12:09:52.486712Z", "tickers": [{"ticker": "STKH", "name": "Steakholder Foods", "status": "ALERT", "price": 0.3, "float": 3000000.0, "change_pct": 0.0, "volume": 13250614, "market_cap": 3000000.0, "country": "US", "cap_size": "nano-cap", "is_penny": true, "news_status": "—", "news_age": "—", "top_headline": "", "sec_filings": "—", "entry_price": 0.3}, {"ticker": "NUWE", "name": "Nuwellis", "status": "ALERT", "price": 0.1674, "float": 1292730.0, "change_pct": -1.5, "volume": 1172208, "market_cap": 1000000.0, "country": "US", "cap_size": "nano-cap", "is_penny": true, "news_status": "—", "news_age": "—", "top_headline": "", "sec_filings": "—", "entry_price": 0.1674}, {"ticker": "GCTK", "name": "Glucotrack", "status": "ALERT", "price": 0.285, "float": 7713220.0, "change_pct": -5.0, "volume": 16918520, "market_cap": 2199949.49, "country": "US", "cap_size": "nano-cap", "is_penny": true, "news_status": "—", "news_age": "—", "top_headline": "", "sec_filings": "—", "entry_price": 0.285}]}
];

let currentIdx = 0;
let newTickers = new Set();
let chart = null;

const fmt = n => (n || n === 0) ? n.toLocaleString(undefined, {maximumFractionDigits: 2}) : '—';

function colorFor(d) {
  if (Math.abs(d.change_pct) > 80) return 'rgba(34,211,238,0.65)'; // glow cyan
  if (d.is_penny) return 'rgba(245,158,11,0.55)'; // penny orange
  if (d.status === 'ALERT') return 'rgba(248,113,113,0.55)'; // alert red
  return 'rgba(45,212,191,0.55)'; // default teal
}
function borderFor(d) {
  if (Math.abs(d.change_pct) > 80) return '#22d3ee';
  if (d.is_penny) return '#f59e0b';
  if (d.status === 'ALERT') return '#f87171';
  return '#2dd4bf';
}

function buildDataset(tickers) {
  const maxChange = Math.max(...tickers.map(d => Math.abs(d.change_pct) || 1), 1);
  return tickers.map(d => ({
    x: Math.max(d.float, 1),
    y: d.price,
    r: Math.max(8, (Math.abs(d.change_pct) || 0) / maxChange * 45),
    _raw: d,
    backgroundColor: colorFor(d),
    borderColor: newTickers.has(d.ticker) ? '#ffffff' : borderFor(d),
    borderWidth: newTickers.has(d.ticker) ? 3 : 1,
  }));
}

function initChart() {
  const ctx = document.getElementById('bubbleCanvas').getContext('2d');
  Chart.register(ChartDataLabels);
  chart = new Chart(ctx, {
    type: 'bubble',
    data: { datasets: [{ data: buildDataset(snapshots[0].tickers), label: 'Scanned tickers' }] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 700, easing: 'easeOutQuart' },
      layout: { padding: 10 },
      scales: {
        x: {
          type: 'logarithmic',
          title: { display: true, text: 'Float (shares, log scale)', color: '#94a3b8', font: { size: 12 } },
          grid: { color: '#1f2937' },
          ticks: { color: '#94a3b8', callback: v => Number(v).toLocaleString(undefined, {notation:'compact', compactDisplay:'short'}) },
          border: { color: '#374151' }
        },
        y: {
          beginAtZero: true,
          title: { display: true, text: 'Price ($)', color: '#94a3b8', font: { size: 12 } },
          grid: { color: '#1f2937' },
          ticks: { color: '#94a3b8', callback: v => '$' + v.toFixed(2) },
          border: { color: '#374151' }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(17,24,39,0.95)',
          titleColor: '#2dd4bf',
          bodyColor: '#94a3b8',
          borderColor: '#1f2937',
          borderWidth: 1,
          padding: 12,
          cornerRadius: 10,
          displayColors: false,
          callbacks: {
            title: ctx => {
              const d = ctx[0].raw._raw;
              return `${d.ticker} — ${d.name}`;
            },
            label: ctx => {
              const d = ctx.raw._raw;
              const pct = d.change_pct ? `${d.change_pct >= 0 ? '+' : ''}${d.change_pct.toFixed(1)}%` : '—';
              return [
                `Status: ${d.status}`,
                `Price: $${fmt(d.price)}`,
                `Entry: $${fmt(d.entry_price)}`,
                `Change: ${pct}`,
                `Float: ${fmt(d.float)}`,
                `Volume: ${fmt(d.volume)}`,
                `Cap: ${d.cap_size || '—'} (${d.country})`,
                `News: ${d.news_status}`,
                `News age: ${d.news_age}`,
                `SEC filings: ${d.sec_filings}`,
                d.top_headline ? `Headline: ${d.top_headline}` : null
              ].filter(Boolean);
            }
          }
        },
        datalabels: {
          color: '#f8fafc',
          font: { weight: 'bold', size: 11 },
          align: 'center',
          anchor: 'center',
          formatter: ctx => ctx.raw._raw.ticker
        },
        annotation: {
          // place-holder; real penny zone drawn below with custom plugin
        }
      }
    },
    plugins: [{
      id: 'pennyZone',
      beforeDraw: (chart) => {
        const { ctx, chartArea: { top, bottom, left, right }, scales: { y } } = chart;
        const y1 = y.getPixelForValue(1);
        if (y1 > top && y1 < bottom) {
          ctx.save();
          ctx.fillStyle = 'rgba(245,158,11,0.07)';
          ctx.fillRect(left, y1, right - left, bottom - y1);
          ctx.fillStyle = 'rgba(245,158,11,0.5)';
          ctx.font = '11px Segoe UI';
          ctx.textAlign = 'right';
          ctx.fillText('Penny stock zone (< $1)', right - 8, bottom - 8);
          ctx.restore();
        }
      }
    }]
  });
  updateTimestamp(snapshots[0].time);
}

function updateTimestamp(t) {
  const el = document.getElementById('last-updated');
  if (t) {
    el.textContent = 'Updated: ' + new Date(t).toLocaleString('en-AU', { timeZone: 'Australia/Sydney' });
  }
}

function showToast(ticker) {
  const toast = document.getElementById('toast');
  toast.textContent = `New ticker: ${ticker}`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 5000);
}

function nextRefresh() {
  const prev = snapshots[currentIdx].tickers;
  currentIdx = (currentIdx + 1) % snapshots.length;
  const next = snapshots[currentIdx];
  const prevSet = new Set(prev.map(d => d.ticker));
  const nextSet = new Set(next.tickers.map(d => d.ticker));
  newTickers = new Set(next.tickers.map(d => d.ticker).filter(t => !prevSet.has(t)));
  const dropped = [...prevSet].filter(t => !nextSet.has(t));

  // Demo: if no real new ticker, flash one so user can see the effect
  if (newTickers.size === 0 && next.tickers.length) {
    const demo = next.tickers[currentIdx % next.tickers.length].ticker;
    newTickers.add(demo);
    showToast(demo);
  } else {
    newTickers.forEach(t => showToast(t));
  }

  chart.data.datasets[0].data = buildDataset(next.tickers);
  chart.update();
  updateTimestamp(next.time);

  setTimeout(() => {
    newTickers.clear();
    if (chart) {
      chart.data.datasets[0].data = buildDataset(next.tickers);
      chart.update('none');
    }
  }, 5000);
}

function resetView() {
  currentIdx = 0;
  newTickers.clear();
  chart.data.datasets[0].data = buildDataset(snapshots[0].tickers);
  chart.update();
  updateTimestamp(snapshots[0].time);
}

window.addEventListener('load', initChart);
</script>
</body>
</html>
