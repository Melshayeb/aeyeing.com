<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Redirecting...</title>
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
        if (!location.search.includes('redirected=1')) {
            var url = '/ozmoeg-trader-v7.html?_=' + Date.now();
            location.replace(url);
        } else {
            document.body.innerHTML = '<p>Please refresh the page.</p>';
        }
    </script>
</head>
<body>Redirecting to latest OzMoEg Trader...</body>
</html>
